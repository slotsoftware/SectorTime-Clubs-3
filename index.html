<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRONOS SLOT PRO OS v7.0 // Multi-Language Race Director</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-black: #1c1c1e;
            --bg-panel: rgba(44, 44, 46, 0.75); 
            --bg-element: rgba(99, 99, 102, 0.4);
            --bg-hover: rgba(120, 120, 125, 0.8);
            --text-main: #ffffff;
            --text-muted: #98989d;
            --apple-blue: #0a84ff;
            --apple-green: #30d158;
            --apple-red: #ff453a;
            --apple-orange: #ff9f0a;
            --apple-yellow: #ffd60a;
            --apple-purple: #bf5af2;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-transform: uppercase; 
        }

        .font-mono-num {
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
            font-variant-numeric: tabular-nums;
        }

        .glass-panel {
            background: var(--bg-panel);
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .apple-box {
            background: rgba(28, 28, 30, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }

        .sector-purple { color: #bf5af2 !important; }
        .sector-green { color: #30d158 !important; }
        .sector-yellow { color: #ffd60a !important; }

        .f1-light {
            width: 24px; height: 24px; border-radius: 50%;
            background: #1c1c1e; border: 1px solid #3a3a3c; transition: all 0.1s ease;
        }
        .f1-light.red-on { background: var(--apple-red); border-color: #ff6961; box-shadow: 0 0 15px var(--apple-red); }
        .f1-light.green-on { background: var(--apple-green); border-color: #32d74b; box-shadow: 0 0 15px var(--apple-green); }

        .f1-light-giant {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #3a3a3c, #000);
            border: 8px solid #111;
            box-shadow: 0 0 0 4px #2c2c2e, inset 0 8px 20px rgba(0,0,0,0.9);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .f1-light-giant::after {
            content: ''; position: absolute;
            top: 8%; left: 15%; width: 40%; height: 30%;
            background: rgba(255,255,255,0.08);
            border-radius: 50%; transform: rotate(-30deg);
        }
        @media (min-width: 768px) {
            .f1-light-giant {
                width: 180px;
                height: 180px;
                border: 12px solid #111;
                box-shadow: 0 0 0 6px #2c2c2e, inset 0 12px 30px rgba(0,0,0,0.9);
            }
        }
        .f1-light-giant.red-on { 
            background: radial-gradient(circle at 40% 40%, #ff6961, #990000); 
            border-color: #330000; 
            box-shadow: 0 0 0 4px #2c2c2e, 0 0 120px 30px rgba(255,69,58,0.7), inset 0 0 60px #ff453a; 
        }
        .f1-light-giant.green-on { 
            background: radial-gradient(circle at 40% 40%, #32d74b, #005500); 
            border-color: #003300; 
            box-shadow: 0 0 0 4px #2c2c2e, 0 0 120px 30px rgba(48,209,88,0.7), inset 0 0 60px #30d158; 
        }

        @keyframes trackCallPulse {
            0%, 100% { box-shadow: 0 0 50px rgba(48, 209, 88, 0.8); }
            50% { box-shadow: 0 0 10px rgba(48, 209, 88, 0.3); }
        }
        .track-call-active-btn { animation: trackCallPulse 1s infinite; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #48484a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #636366; }

        .segmented-control { background: rgba(28, 28, 30, 0.8); border-radius: 99px; padding: 4px; display: inline-flex; }

        body.race-mode-active #topRaceBar,
        body.race-mode-active nav,
        body.race-mode-active .hide-in-race {
            display: none !important;
        }
        body.race-mode-active #lanesGridContainer {
            grid-column: span 12 / span 12 !important;
        }
        body.race-mode-active #floatingRaceUI {
            display: flex !important;
        }
        
        .arrow-up { color: var(--apple-red); }
        .arrow-down { color: var(--apple-green); }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between p-2 md:px-4 md:py-3">

    <!-- FLOATING RACE UI -->
    <div id="floatingRaceUI" class="fixed top-6 right-6 z-50 hidden items-center gap-4 opacity-75 hover:opacity-100 transition-opacity bg-[var(--bg-panel)] backdrop-blur-xl p-3 rounded-full border border-white/10 shadow-2xl">
        <button onclick="goHome()" data-i18n="home" class="px-6 py-4 bg-[var(--bg-element)] hover:bg-[#ff453a] hover:text-white text-white font-black text-xl rounded-full transition cursor-pointer shadow-lg">
            🏠 INICIO
        </button>
        <div id="floatingMasterClock" class="font-mono-num font-black text-white px-3 text-3xl md:text-5xl tracking-widest">00:00</div>
        <button id="btnFloatingTrackCall" onclick="toggleTrackCall()" data-i18n="track_call" class="px-8 py-4 bg-[#ff9f0a] hover:bg-[#ffd60a] active:scale-95 text-black font-black text-xl rounded-full shadow-[0_4px_20px_rgba(255,159,10,0.5)] transition cursor-pointer">
            ⚠️ TRACK CALL
        </button>
    </div>

    <!-- OVERLAY SEMÁFORO -->
    <div id="centerF1Overlay" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl hidden flex-col items-center justify-center overflow-hidden">
        <div class="text-[140px] md:text-[300px] font-black text-white mb-12 tracking-tighter uppercase transition-transform duration-100 italic" id="centerF1Text" style="line-height: 1; text-shadow: 0 10px 40px rgba(255,255,255,0.4), 0 0 100px rgba(255,255,255,0.2);"></div>
        <div class="flex gap-6 md:gap-10 p-8 md:p-14 bg-gradient-to-b from-[#3a3a3c] to-[#1c1c1e] border-4 border-[#111] rounded-[120px] shadow-[0_40px_100px_rgba(0,0,0,1)] relative z-10">
            <div class="absolute inset-0 bg-black/10 rounded-[120px]" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.3) 10px, rgba(0,0,0,0.3) 20px);"></div>
            <div class="f1-light-giant z-10" id="giantL1"></div>
            <div class="f1-light-giant z-10" id="giantL2"></div>
            <div class="f1-light-giant z-10" id="giantL3"></div>
            <div class="f1-light-giant z-10" id="giantL4"></div>
            <div class="f1-light-giant z-10" id="giantL5"></div>
        </div>
    </div>

                <button id="btnSession-CLUB" data-i18n="club" class="px-6 py-3 text-lg md:text-xl font-black rounded-full bg-[var(--bg-element)] text-[var(--text-muted)] hover:text-white transition cursor-pointer">CARRERA CLUB</button>
            </div>
            
            <div class="segmented-control gap-1 shadow-md border border-white/10 p-1.5 w-max">
                <button onclick="setRaceFormat('TIME')" id="btnMode-TIME" data-i18n="time_mode" class="px-6 py-2 text-lg md:text-xl font-black rounded-full bg-[#0a84ff] text-white shadow-sm cursor-pointer transition">⏱️ TIEMPO</button>
                <button onclick="setRaceFormat('LAPS')" id="btnMode-LAPS" data-i18n="laps_mode" class="px-6 py-2 text-lg md:text-xl font-black rounded-full text-[var(--text-muted)] hover:text-white cursor-pointer transition">🏁 VUELTAS</button>
            </div>
        </div>

        <div class="flex flex-col items-center gap-3">
            <div class="flex items-center gap-3">
                <h1 id="appMainTitle" data-i18n="title" class="text-xl md:text-2xl font-black tracking-tight text-white flex items-center gap-2">
                    GRAN PREMIO OFICIAL // KRONOS PRO
                </h1>
                <span id="raceStateBadge" data-i18n="standby" class="px-4 py-1.5 text-sm font-black rounded-full bg-[var(--bg-element)] text-[var(--text-muted)]">
                    ESPERA
                </span>
            </div>

            <div class="flex items-center justify-center flex-wrap gap-2">
                <!-- IDIOMA CON BANDERAS SVG -->
                <div class="relative apple-box px-3 py-2 flex items-center" id="customLangDropdown">
                    <button type="button" onclick="toggleLangMenu(event)" class="flex items-center gap-2.5 text-lg font-black text-white focus:outline-none cursor-pointer">
                        <span id="currentLangFlag" class="w-7 h-5 flex items-center justify-center rounded-[4px] overflow-hidden shadow-sm border border-white/20"></span>
                        <span id="currentLangLabel">Español (ES)</span>
                        <span class="text-xs text-[var(--text-muted)] ml-1">▼</span>
                    </button>
                    <div id="langMenuPopup" class="hidden absolute top-full left-0 mt-2 w-56 glass-panel p-2 z-50 flex-col gap-1 border border-white/15 shadow-2xl">
                        <!-- Opciones generadas dinámicamente con SVG -->
                    </div>
                </div>

                <div class="flex items-center gap-2 apple-box px-3 py-2.5">
                    <span class="text-sm text-[var(--text-muted)] font-black">CH:</span>
                    <select id="headerLanesSelect" onchange="setSystemTopology(parseInt(this.value), null)" class="bg-transparent text-lg font-black text-[#0a84ff] focus:outline-none cursor-pointer">
                        <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option>
                        <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
                        <option value="9">9</option><option value="10">10</option>
                    </select>
                </div>

                <!-- VOZ (SOLO HOMBRE / MUJER POR IDIOMA) -->
                <div class="flex items-center gap-2 apple-box px-3 py-2.5">
                    <span class="text-sm text-[var(--text-muted)] font-black" data-i18n="voice_label">VOZ:</span>
                    <select id="headerVoiceSelect" onchange="updateVoiceLabels()" class="bg-[#2c2c2e] text-lg font-black text-[#bf5af2] rounded-xl px-2 py-0.5 focus:outline-none cursor-pointer">
                        <option value="MALE" id="optVoiceMale">👨 HOMBRE</option>
                        <option value="FEMALE" id="optVoiceFemale">👩 MUJER</option>
                    </select>
                    <button onclick="testVoice()" data-i18n="test_btn" class="ml-1 px-3 py-1 bg-[var(--bg-element)] hover:bg-[#bf5af2] hover:text-white rounded-full text-sm font-black transition cursor-pointer">
                        🔊 PROBAR
                    </button>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-end gap-3">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-1.5" id="f1Gantry">
                    <div class="f1-light" id="f1L1"></div><div class="f1-light" id="f1L2"></div><div class="f1-light" id="f1L3"></div><div class="f1-light" id="f1L4"></div><div class="f1-light" id="f1L5"></div>
                </div>
                <div class="text-right border-l border-white/10 pl-5">
                    <div id="masterClockLabel" data-i18n="track_time" class="text-base font-black text-[#ff9f0a] tracking-widest">CRONO MANGA</div>
                    <div id="masterClock" class="text-5xl md:text-6xl font-mono-num font-black text-white tracking-tight leading-none">05:00.0</div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="startF1Sequence()" data-i18n="f1_start" class="px-6 py-3.5 bg-[#30d158] hover:bg-[#32d74b] active:scale-95 text-black font-black text-lg rounded-full shadow-lg transition cursor-pointer">
                    🚦 SALIDA F1
                </button>
                <button onclick="toggleAutoDemo()" id="btnAutoDemo" data-i18n="auto_sim" class="px-6 py-3.5 bg-[var(--bg-element)] hover:bg-[#bf5af2] hover:text-white text-[#e5b3ff] font-black text-lg rounded-full transition cursor-pointer">
                    🤖 AUTO-SIM
                </button>
                <button onclick="toggleFullScreenMode()" class="px-5 py-3.5 bg-[var(--bg-element)] hover:bg-[#0a84ff] text-[#0a84ff] hover:text-white font-black text-lg rounded-full transition cursor-pointer" title="Pantalla Completa">
                    ⛶
                </button>
                <button onclick="resetRaceSession()" class="px-5 py-3.5 bg-[var(--bg-element)] hover:bg-[var(--bg-hover)] text-white font-black text-lg rounded-full transition cursor-pointer" title="Reiniciar">
                    🔄
                </button>
            </div>
        </div>
    </header>

    <nav class="flex items-center justify-between gap-4 mb-4 shrink-0 px-2">
        <div class="segmented-control p-2 gap-2 border border-white/10 overflow-x-auto">
            <button data-i18n="live_grid" class="px-6 py-3 rounded-full text-base font-black bg-[var(--bg-hover)] text-white shadow-md transition cursor-pointer shrink-0">
                🏁 PARRILLA EN VIVO
            </button>
        </div>
    </nav>

        // Busca una voz instalada que coincida estrictamente con el idioma y con el género pedido
        function findStrictLocalVoice(langCode, gender) {
            if (!cachedVoices || cachedVoices.length === 0) {
                cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            }

            const profile = NATIVE_SPEAKER_PROFILES[langCode] || NATIVE_SPEAKER_PROFILES['es'];
            const langPrefix = langCode.toLowerCase();

            // Filtrar solo voces nativas del idioma seleccionado (sin mezclar otros idiomas)
            const langVoices = cachedVoices.filter(v => {
                const l = v.lang.toLowerCase().replace('_', '-');
                return l === profile.locale.toLowerCase() || l.startsWith(langPrefix + '-') || l === langPrefix;
            });

            if (langVoices.length === 0) return null;

            const targetKeywords = profile[gender].keywords;
            const oppositeGender = gender === 'MALE' ? 'FEMALE' : 'MALE';
            const oppositeKeywords = profile[oppositeGender].keywords;

            const matchesKeyword = (name, kwList) => kwList.some(kw => name.toLowerCase().includes(kw));

            // Filtrar estrictamente las voces que tienen nombre/identificador del género buscado
            let verifiedVoices = langVoices.filter(v => {
                const n = v.name.toLowerCase();
                return matchesKeyword(n, targetKeywords) && !matchesKeyword(n, oppositeKeywords);
            });

            if (verifiedVoices.length === 0) return null;

            // Priorizar voces Neurales / Naturales del sistema operativo
            const scoreQuality = (v) => {
                let s = 0;
                const n = v.name.toLowerCase();
                if (n.includes('natural') || n.includes('neural')) s += 50;
                if (n.includes('online')) s += 30;
                if (n.includes('premium') || n.includes('enhanced') || n.includes('siri')) s += 25;
                return s;
            };

            verifiedVoices.sort((a, b) => scoreQuality(b) - scoreQuality(a));
            return verifiedVoices[0];
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            return bytes.buffer;
        }

        function pcmToWav(pcm16, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(buffer);
            const writeString = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + pcm16.length * 2, true);
            writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(view, 36, 'data'); view.setUint32(40, pcm16.length * 2, true);
            let offset = 44; for (let i = 0; i < pcm16.length; i++, offset += 2) view.setInt16(offset, pcm16[i], true);
            return new Blob([view], { type: 'audio/wav' });
        }

        // Genera y reproduce voz neuronal con pronunciación nativa exacta y género garantizado

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) return null;
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                if (part?.inlineData?.data) {
                    const sampleRate = parseInt(part.inlineData.mimeType.match(/rate=(\d+)/)?.[1] || "24000", 10);
                    const pcm16 = new Int16Array(base64ToArrayBuffer(part.inlineData.data));
                    const audioUrl = URL.createObjectURL(pcmToWav(pcm16, sampleRate));
                    neuralAudioCache[cacheKey] = audioUrl;
                    return audioUrl;
                }
            } catch (e) {
                return null;
            }
            return null;
        }

        // Pre-carga la salida F1 para que el semáforo nunca tenga retraso de red
        function WarmUpCountdownAudio() {
            const voiceSelect = document.getElementById('headerVoiceSelect');
            const gender = voiceSelect ? voiceSelect.value : 'MALE';
            if (findStrictLocalVoice(currentLang, gender)) return; // Si tiene voz local nativa instantánea, no hace falta red
            fetchNeuralAudioUrl(t('tts_go'), currentLang, gender);
        }

        function isCommentatorSpeaking() {
            const synthBusy = window.speechSynthesis && window.speechSynthesis.speaking;
            const audioBusy = activeAudioObj && !activeAudioObj.paused && !activeAudioObj.ended;
            return synthBusy || audioBusy;
        }

        // speakSpotter con sistema de prioridades:
        // priority = 'HIGH' (interrumpe inmediatamente: Salida, Bandera Amarilla, Victoria, Récord Morado)
        // priority = 'NORMAL' (no pisa una frase en curso: narración de vueltas y batallas)
        // instantSync = true (garantiza latencia 0ms para el semáforo de salida)
        async function speakSpotter(text, priority = 'HIGH', instantSync = false) {
            if (!text) return;
            if (priority === 'NORMAL' && isCommentatorSpeaking()) return;

            const voiceSelect = document.getElementById('headerVoiceSelect');
            const gender = voiceSelect ? voiceSelect.value : 'MALE';
            const profile = NATIVE_SPEAKER_PROFILES[currentLang] || NATIVE_SPEAKER_PROFILES['es'];
            const cacheKey = `${currentLang}|${gender}|${text}`;

            if (priority === 'HIGH') {
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                if (activeAudioObj) { activeAudioObj.pause(); activeAudioObj.currentTime = 0; }
            }

            // 1. Verificar si existe voz nativa local instalada del género correcto (Latencia 0ms)
            const verifiedLocalVoice = findStrictLocalVoice(currentLang, gender);
            if (verifiedLocalVoice && window.speechSynthesis) {
                const ut = new SpeechSynthesisUtterance(text);
                ut.voice = verifiedLocalVoice;
                ut.lang = verifiedLocalVoice.lang;
                ut.pitch = 1.0;
                ut.rate = instantSync ? 1.18 : 1.05; // Ritmo vivo de narrador de F1
                ut.volume = 1.0;
                window.speechSynthesis.speak(ut);
                return;
            }

            // 2. Si ya está en la caché neuronal (Latencia 0ms)
            if (neuralAudioCache[cacheKey]) {
                activeAudioObj = new Audio(neuralAudioCache[cacheKey]);
                activeAudioObj.play().catch(() => {});
                return;
            }

            // 3. Si requiere sincronización milimétrica (ej. cuenta atrás 5-4-3-2-1 del semáforo) y aún no está en caché,
            // usar síntesis inmediata para no desincronizar las luces y precargar en segundo plano
            if (instantSync && window.speechSynthesis) {
                const ut = new SpeechSynthesisUtterance(text);
                ut.lang = profile.locale;
                const anyLangVoice = cachedVoices.find(v => v.lang.toLowerCase().startsWith(currentLang));
                if (anyLangVoice) ut.voice = anyLangVoice;
                ut.pitch = gender === 'MALE' ? 0.85 : 1.05;
                ut.rate = 1.18;
                window.speechSynthesis.speak(ut);
                fetchNeuralAudioUrl(text, currentLang, gender);
                return;
            }

            // 4. Narración neuronal F1 de alta definición
            const neuralUrl = await fetchNeuralAudioUrl(text, currentLang, gender);
            if (neuralUrl) {
                if (priority === 'NORMAL' && isCommentatorSpeaking()) return;
                activeAudioObj = new Audio(neuralUrl);
                activeAudioObj.play().catch(() => {});
                return;
            }

            // 5. Fallback de emergencia offline
            if (window.speechSynthesis) {
                const ut = new SpeechSynthesisUtterance(text);
                ut.lang = profile.locale;
                const anyLangVoice = cachedVoices.find(v => v.lang.toLowerCase().startsWith(currentLang));
                if (anyLangVoice) ut.voice = anyLangVoice;
                ut.pitch = gender === 'MALE' ? 0.85 : 1.05;
                ut.rate = 1.05;
                window.speechSynthesis.speak(ut);
            }
        }

            speakSpotter(t('tts_test'), 'HIGH', false);
        }

        function getDriverMeanLap(lane) {
            if (!lane.history.length) return 0;

                            <div class="text-center bg-[var(--bg-element)] rounded-lg p-2"><div class="text-xs text-[var(--text-muted)] font-bold">${sCount === 2 ? t('finish_line') : 'S2'}</div><div id="secVal-${i}-2" class="flex justify-center items-center text-xl md:text-3xl font-mono-num font-black ${getSecColor(lane.sectorColors[2])}">${s2Val}<span class="${tr2==='▼'?'arrow-down':'arrow-up'} text-xl ml-1">${tr2}</span></div></div>
                            ${sCount === 3 ? `<div class="text-center bg-[var(--bg-element)] rounded-lg p-2"><div class="text-xs text-[var(--text-muted)] font-bold">${t('finish_line')}</div><div id="secVal-${i}-3" class="flex justify-center items-center text-xl md:text-3xl font-mono-num font-black ${getSecColor(lane.sectorColors[3])}">${s3Val}<span class="${tr3==='▼'?'arrow-down':'arrow-up'} text-xl ml-1">${tr3}</span></div></div>` : ''}

                html += `

        function updateDriverName(laneId, newName) {
            if (appState.lanes[laneId] && newName.trim() !== '') {
                appState.lanes[laneId].name = newName.trim().toUpperCase();
            }
        }

        // Evalúa la clasificación en tiempo real y genera comentarios profesionales de Fórmula 1
        function evaluateF1Commentary(lane, lapSec, isPurpleLap, isPersonalBest) {
            const now = performance.now();
            const activeList = [];
            for (let i = 1; i <= appState.activeLanes; i++) {
                activeList.push(appState.lanes[i]);
            }

            // Ordenar por vueltas completadas (descendente) y por quién cruzó antes la meta en esa vuelta
            activeList.sort((a, b) => {
                if (b.laps !== a.laps) return b.laps - a.laps;
                return a.lastLapPassTime - b.lastLapPassTime;
            });

            const leader = activeList[0];
            const second = activeList.length > 1 ? activeList[1] : null;
            const prevLeaderId = appState.currentLeaderId;
            appState.currentLeaderId = leader.id;

            // 1. Aviso de ÚLTIMA VUELTA (Modo vueltas)
            if (appState.raceFormat === 'LAPS' && leader.laps === appState.targetLaps - 1 && !appState.announcedLastLap) {
                appState.announcedLastLap = true;
                appState.lastCommentaryTime = now;
                speakSpotter(f1Text().last_lap(leader.name), 'HIGH', false);
                return;
            }

            // 2. Cambio de líder en carrera (después de la vuelta 1)
            if (prevLeaderId !== null && prevLeaderId !== leader.id && leader.laps > 1) {
                appState.lastCommentaryTime = now;
                speakSpotter(f1Text().new_leader(leader.name, leader.id), 'HIGH', false);
                return;
            }

            // 3. Vuelta rápida absoluta de la carrera (Sector/Vuelta Morada) tras la primera vuelta de lanzamiento
            if (isPurpleLap && lane.laps > 1 && (now - appState.lastCommentaryTime > 4500)) {
                appState.lastCommentaryTime = now;
                speakSpotter(f1Text().purple_lap(lane.name, lapSec), 'HIGH', false);
                return;
            }

            // Respetar margen entre comentarios normales para no saturar la retransmisión
            if (now - appState.lastCommentaryTime < 5500) return;

            // 4. Batalla cuerpo a cuerpo (misma vuelta y menos de 0.6s de diferencia al cruzar meta)
            if (second && leader.laps > 1 && leader.laps === second.laps) {
                const gapMs = Math.abs(leader.lastLapPassTime - second.lastLapPassTime);
                if (gapMs > 0 && gapMs < 650) {
                    const tenths = Math.max(1, Math.round(gapMs / 100));
                    appState.lastCommentaryTime = now;
                    speakSpotter(f1Text().battle(leader.name, second.name, tenths), 'NORMAL', false);
                    return;
                }
            }

            // 5. Cantar paso por vuelta del líder cada 3 vueltas
            if (lane.id === leader.id && leader.laps > 1 && leader.laps % 3 === 0) {
                appState.lastCommentaryTime = now;
                speakSpotter(f1Text().lap_milestone(leader.name, leader.laps), 'NORMAL', false);
                return;
            }

            // 6. Récord personal en verde
            if (isPersonalBest && lane.laps > 2) {
                appState.lastCommentaryTime = now;
                speakSpotter(f1Text().personal_best(lane.name, lapSec), 'NORMAL', false);
            }
        }

        function triggerNextCheckpoint(laneId) {
            const lane = appState.lanes[laneId];
            if (appState.raceStatus === 'COUNTDOWN') { 
                speakSpotter(`${t('tts_false_start')} ${laneId}`, 'HIGH', true); 
                lane.laps = Math.max(-1, lane.laps - 1); 
                return renderLanesGrid(); 
            }
            if (appState.raceStatus === 'STANDBY') { appState.raceStatus = 'RACING'; document.body.classList.add('race-mode-active'); startMasterClock(); }
            if (appState.raceStatus === 'TRACK_CALL') return; 

            const lapSec = 3.5 + Math.random(); 
            lane.laps++; lane.lastLap = lapSec; lane.history.push(lapSec); lane.lastLapPassTime = performance.now();
            
            let isPurpleLap = false;
            let isPersonalBest = false;

            if (lapSec < appState.overallBestLap) { 
                appState.overallBestLap = lapSec; 
                lane.bestLap = lapSec; 
                isPurpleLap = true;
                playTone(1318.5, 180, 'triangle', 0.22); 
            } else if (lapSec < lane.bestLap) { 
                lane.bestLap = lapSec; 
                isPersonalBest = true;
                playTone(987.77, 130, 'sine', 0.16); 
            }
            
            for(let s=1; s<=appState.numSectors; s++) {
                lane.prevSectors[s] = lane.lastSectors[s];
                lane.lastSectors[s] = (lapSec / appState.numSectors) + (Math.random() * 0.04 - 0.02); 
                if(lane.lastSectors[s] < lane.bestSectors[s]) {
                    lane.bestSectors[s] = lane.lastSectors[s]; lane.sectorColors[s] = (lapSec === appState.overallBestLap) ? 'sector-purple' : 'sector-green';
                } else lane.sectorColors[s] = 'text-white';
            }
            
            renderLanesGrid();

            // Comprobar final de carrera por vueltas
            if (appState.raceFormat === 'LAPS' && lane.laps >= appState.targetLaps && appState.raceStatus === 'RACING') {
                appState.raceStatus = 'FINISHED'; clearInterval(appState.clockInterval); if(appState.autoDemoTimer) clearInterval(appState.autoDemoTimer);
                document.body.classList.remove('race-mode-active'); 
                speakSpotter(`${t('tts_victory')} ${lane.name}!`, 'HIGH', false);
                return;
            }

            // Narración profesional F1 en directo
            if (appState.raceStatus === 'RACING') {
                evaluateF1Commentary(lane, lapSec, isPurpleLap, isPersonalBest);
            }
        }

        function toggleAutoDemo() {
            if (appState.autoDemoTimer || appState.raceStatus === 'COUNTDOWN') {
                clearInterval(appState.autoDemoTimer); appState.autoDemoTimer = null; appState.pendingAutoSim = false;
                if(appState.raceStatus === 'RACING') speakSpotter(t('tts_pause'), 'HIGH', false);
            } else {
                if (appState.raceStatus === 'STANDBY' || appState.raceStatus === 'FINISHED') { appState.pendingAutoSim = true; startF1Sequence(); }
                else { appState.autoDemoTimer = setInterval(() => triggerNextCheckpoint(1 + Math.floor(Math.random() * appState.activeLanes)), 950); }
            }
        }

        function startF1Sequence() {
            if (appState.raceStatus === 'RACING' || appState.raceStatus === 'COUNTDOWN') return;
            countdownTimeouts.forEach(t => clearTimeout(t)); countdownTimeouts = [];
            
            // Pre-calentar audio de salida en el idioma actual
            WarmUpCountdownAudio();

            const overlay = document.getElementById('centerF1Overlay');
            overlay.classList.remove('hidden'); overlay.classList.add('flex');
            const centerText = document.getElementById('centerF1Text');
            centerText.style.fontSize = ''; centerText.textContent = ''; centerText.style.transform = 'scale(1)';
            for (let i=1; i<=5; i++) {
                document.getElementById(`giantL${i}`).className = 'f1-light-giant z-10';
                document.getElementById(`f1L${i}`).className = 'f1-light';
            }
            
            appState.raceStatus = 'COUNTDOWN'; document.body.classList.add('race-mode-active');
            
            // Secuencia sincronizada al milisegundo (1000ms por luz roja + voz instantánea en el idioma activo)
            for (let i = 1; i <= 5; i++) {
                countdownTimeouts.push(setTimeout(() => { 
                    document.getElementById(`giantL${i}`).classList.add('red-on');
                    document.getElementById(`f1L${i}`).classList.add('red-on');
                    const countDownNum = 6 - i;
                    centerText.textContent = String(countDownNum);
                    centerText.style.transform = 'scale(1.15)'; setTimeout(() => centerText.style.transform = 'scale(1)', 150);
                    
                    // instantSync = true garantiza que el número suene en el mismo instante en que se enciende el foco rojo
                    speakSpotter(t('nums')[countDownNum], 'HIGH', true); 
                    playTone(440, 130, 'square', 0.2); 
                }, i * 1000));
            }

            countdownTimeouts.push(setTimeout(() => {
                for (let i=1; i<=5; i++) { 
                    document.getElementById(`giantL${i}`).classList.remove('red-on'); document.getElementById(`giantL${i}`).classList.add('green-on'); 
                    document.getElementById(`f1L${i}`).classList.remove('red-on'); document.getElementById(`f1L${i}`).classList.add('green-on');
                }
                centerText.style.fontSize = window.innerWidth < 768 ? '80px' : '150px'; 
                centerText.textContent = 'GO!'; centerText.style.transform = 'scale(1.1)'; setTimeout(() => centerText.style.transform = 'scale(1)', 150);
                
                // Grito de salida F1 sincronizado con el encendido verde
                speakSpotter(t('tts_go'), 'HIGH', true); 
                playTone(1046.5, 450, 'sawtooth', 0.25);
                
                appState.raceStatus = 'RACING'; 
                appState.lastCommentaryTime = performance.now();
                startMasterClock();
                
                if (appState.pendingAutoSim) { 
                    appState.autoDemoTimer = setInterval(() => triggerNextCheckpoint(1 + Math.floor(Math.random() * appState.activeLanes)), 950); 
                    appState.pendingAutoSim = false; 
                }
                setTimeout(() => { 
                    overlay.classList.remove('flex'); overlay.classList.add('hidden'); 
                    for(let i=1; i<=5; i++) {
                        document.getElementById(`giantL${i}`).className = 'f1-light-giant z-10';
                        document.getElementById(`f1L${i}`).className = 'f1-light';
                    }
                }, 1800);
            }, 6000));
        }

        function toggleTrackCall() {
            const btnFloat = document.getElementById('btnFloatingTrackCall');
            if (appState.raceStatus === 'RACING') { 
                appState.raceStatus = 'TRACK_CALL'; 
                if (btnFloat) { btnFloat.innerHTML = `🟢 ${t('resume')}`; btnFloat.className = 'px-8 py-4 bg-[#30d158] hover:bg-[#32d74b] active:scale-95 text-black font-black text-xl rounded-full shadow-[0_4px_20px_rgba(48,209,88,0.5)] transition cursor-pointer track-call-active-btn'; }
                speakSpotter(t('tts_pause'), 'HIGH', false); 
            } 
            else if (appState.raceStatus === 'TRACK_CALL') { 
                appState.raceStatus = 'RACING'; 
                if (btnFloat) { btnFloat.innerHTML = `⚠️ ${t('track_call')}`; btnFloat.className = 'px-8 py-4 bg-[#ff9f0a] hover:bg-[#ffd60a] active:scale-95 text-black font-black text-xl rounded-full shadow-[0_4px_20px_rgba(255,159,10,0.5)] transition cursor-pointer'; }
                speakSpotter(t('tts_resume'), 'HIGH', false);

        function startMasterClock() {
            if (appState.clockInterval) clearInterval(appState.clockInterval);
            appState.clockInterval = setInterval(() => {
                if (appState.raceStatus !== 'RACING') return;
                if (appState.raceFormat === 'TIME') {
                    appState.remainingSeconds = Math.max(0, appState.remainingSeconds - 0.1);
                    
                    // Avisos de tiempo del comentarista de F1 (1 minuto y 30 segundos)
                    if (Math.abs(appState.remainingSeconds - 60.0) < 0.08 && !appState.announcedOneMin) {
                        appState.announcedOneMin = true;
                        speakSpotter(f1Text().one_min, 'HIGH', false);
                    }
                    if (Math.abs(appState.remainingSeconds - 30.0) < 0.08 && !appState.announcedThirtySec) {
                        appState.announcedThirtySec = true;
                        speakSpotter(f1Text().thirty_sec, 'HIGH', false);
                    }
                }
                renderMasterClock();
                if (appState.raceFormat === 'TIME' && appState.remainingSeconds <= 0) { 
                    appState.raceStatus = 'FINISHED'; clearInterval(appState.clockInterval); 
                    if(appState.autoDemoTimer) clearInterval(appState.autoDemoTimer); 
                    document.body.classList.remove('race-mode-active'); 
                    speakSpotter(t('tts_end'), 'HIGH', false);
                }
            }, 100);
        }

        function renderMasterClock() {
            let txt = '';
            if (appState.raceFormat === 'LAPS') { const maxLaps = Math.max(...Object.values(appState.lanes).map(l => l.laps)); txt = `${maxLaps} / ${appState.targetLaps}`; } 
            else { const m = Math.floor(appState.remainingSeconds / 60), s = (appState.remainingSeconds % 60).toFixed(1); txt = `${String(m).padStart(2,'0')}:${s.padStart(4,'0')}`; }
            document.getElementById('masterClock').textContent = txt; document.getElementById('floatingMasterClock').textContent = txt;
        }

        function toggleFullScreenMode() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {});
        }

        function goHome() {
            appState.raceStatus = 'STANDBY'; clearInterval(appState.clockInterval);
            if (appState.autoDemoTimer) { clearInterval(appState.autoDemoTimer); appState.autoDemoTimer = null; appState.pendingAutoSim = false; }
            countdownTimeouts.forEach(t => clearTimeout(t)); countdownTimeouts = [];
            document.body.classList.remove('race-mode-active');
            const overlay = document.getElementById('centerF1Overlay'); if(overlay) { overlay.classList.remove('flex'); overlay.classList.add('hidden'); }
            const btnFloat = document.getElementById('btnFloatingTrackCall');
            if (btnFloat) { btnFloat.innerHTML = `⚠️ ${t('track_call')}`; btnFloat.className = 'px-8 py-4 bg-[#ff9f0a] hover:bg-[#ffd60a] active:scale-95 text-black font-black text-xl rounded-full shadow-[0_4px_20px_rgba(255,159,10,0.5)] transition cursor-pointer'; }
        }
        
        function resetRaceSession() { location.reload(); }

        window.onload = function() { 
            initAllLanesData(); 
            initLangDropdown();
            setSystemTopology(2, 3); 
            setRaceFormat('TIME');
            
            if (window.speechSynthesis) window.speechSynthesis.getVoices();
            
            changeLanguage('es');
        };
    </script>
</body>
</html>
